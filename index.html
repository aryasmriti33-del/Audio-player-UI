<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Web Lite</title>
<style>
:root{
  --bg:#0f1412; --panel:#18201c; --panel2:#212b26; --ink:#eef3ef; --muted:#8fa196;
  --accent:#2fe07a; --line:#2c3832;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.app{grid-template-columns:1fr}}
.now,.list{background:var(--panel);border-radius:18px;padding:24px}
.cover{aspect-ratio:1;border-radius:14px;display:flex;align-items:flex-end;padding:16px;font-size:2.2rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;transition:background .4s}
.meta{margin:18px 0 14px}
.meta h1{font-size:1.35rem}
.meta p{color:var(--muted)}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em;margin-bottom:6px}
.seek{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--fill,0%),var(--line) var(--fill,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink)}
.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ctl{width:44px;height:44px;border-radius:50%;background:var(--panel2);font-size:1rem}
.ctl:hover{background:var(--line)}
.play{width:60px;height:60px;background:var(--accent);color:#06130b;font-size:1.3rem}
.play:hover{background:#5df29b}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted)}
.vol input{max-width:160px}
.list h2{font-size:1rem;margin-bottom:12px}
ul{list-style:none;padding:0}
li button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:10px}
li button:hover{background:var(--panel2)}
li.active button{background:var(--panel2);color:var(--accent)}
li .idx{color:var(--muted);text-align:center}
li .art{display:block;color:var(--muted);font-size:.85rem}
li .dur{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bars{display:none;gap:2px;align-items:flex-end;height:14px;justify-content:center}
.bars i{width:3px;background:var(--accent);animation:b .8s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
li.active.playing .bars{display:flex}
li.active.playing .idx-n{display:none}
@keyframes b{0%,100%{height:4px}50%{height:14px}}
@media(prefers-reduced-motion:reduce){.bars i{animation:none;height:10px}}
</style>
</head>
<body>
<main class="app">
  <section class="now" aria-label="Now playing">
    <div class="cover" id="cover"></div>
    <div class="meta"><h1 id="title">—</h1><p id="artist"></p></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button class="ctl" id="prev" aria-label="Previous track">&#9198;</button>
      <button class="ctl play" id="play" aria-label="Play">&#9654;</button>
      <button class="ctl" id="next" aria-label="Next track">&#9197;</button>
    </div>
    <div class="vol">
      <span aria-hidden="true">&#128265;</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
    </div>
  </section>
  <section class="list" aria-label="Playlist">
    <h2>Playlist</h2>
    <ul id="playlist"></ul>
  </section>
</main>

<script>
// Royalty-free demo tracks (SoundHelix). Swap in your own URLs or local /audio files.
const tracks = [1,2,3,4,5].map((n,i)=>({
  title:["Neon Drift","Slow Orbit","Paper Lanterns","Last Train Home","Open Water"][i],
  artist:["T. Helix","T. Helix","T. Helix","T. Helix","T. Helix"][i],
  src:`https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${n}.mp3`,
  color:["#2fe07a","#e0a82f","#e05a2f","#2f9be0","#b02fe0"][i],
  duration:0
}));

const $ = id => document.getElementById(id);
const audio = new Audio();          // single Audio object, reused for every track
audio.preload = "metadata";
audio.volume = 0.7;

let index = 0;
let seeking = false;                // true while the user drags the seek bar

const fmt = s => {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return `${m}:${String(r).padStart(2,"0")}`;
};
const fill = el => el.style.setProperty("--fill", (el.value-el.min)/(el.max-el.min)*100 + "%");

// ---- Playlist rendering ----
function renderList(){
  $("playlist").innerHTML = "";
  tracks.forEach((t,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `<button aria-label="Play ${t.title}">
      <span class="idx"><span class="idx-n">${i+1}</span><span class="bars"><i></i><i></i><i></i></span></span>
      <span><strong>${t.title}</strong><span class="art">${t.artist}</span></span>
      <span class="dur">${t.duration?fmt(t.duration):""}</span></button>`;
    li.querySelector("button").addEventListener("click",()=> i===index ? toggle() : load(i,true));
    $("playlist").appendChild(li);
  });
  syncList();
}
function syncList(){
  [...$("playlist").children].forEach((li,i)=>{
    li.classList.toggle("active", i===index);
    li.classList.toggle("playing", i===index && !audio.paused);
    if (tracks[i].duration) li.querySelector(".dur").textContent = fmt(tracks[i].duration);
  });
}

// ---- Loading a track ----
function load(i, autoplay=false){
  index = (i + tracks.length) % tracks.length;
  const t = tracks[index];
  audio.src = t.src;                // replaces the stream; same listeners stay attached
  $("title").textContent = t.title;
  $("artist").textContent = t.artist;
  $("cover").textContent = t.title;
  $("cover").style.background = `linear-gradient(145deg, ${t.color}, #0f1412 130%)`;
  $("cover").style.color = "#06130b";
  $("seek").value = 0; fill($("seek"));
  $("cur").textContent = "0:00"; $("dur").textContent = fmt(t.duration);
  $("status").textContent = "Loading…";
  document.title = `${t.title} · Spotify Web Lite`;
  if ("mediaSession" in navigator)
    navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist});
  syncList();
  if (autoplay) play();
}
function play(){
  const p = audio.play();
  if (p) p.catch(err => { if (err.name !== "AbortError") $("status").textContent = "Playback blocked or failed. Press play to retry."; });
}
function toggle(){ audio.paused ? play() : audio.pause(); }

// ---- Audio events (attached once, so no listener build-up on rapid skipping) ----
audio.addEventListener("loadedmetadata", ()=>{
  tracks[index].duration = audio.duration;
  $("dur").textContent = fmt(audio.duration);
  syncList();
});
audio.addEventListener("timeupdate", ()=>{
  if (seeking || !audio.duration) return;
  $("seek").value = audio.currentTime / audio.duration * 100;
  fill($("seek"));
  $("cur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("play",    ()=>{ $("play").innerHTML="&#10074;&#10074;"; $("play").setAttribute("aria-label","Pause"); syncList(); });
audio.addEventListener("pause",   ()=>{ $("play").innerHTML="&#9654;"; $("play").setAttribute("aria-label","Play"); syncList(); });
audio.addEventListener("waiting", ()=> $("status").textContent = "Buffering…");
audio.addEventListener("canplay", ()=> $("status").textContent = "");
audio.addEventListener("playing", ()=> $("status").textContent = "");
audio.addEventListener("ended",   ()=> load(index+1, true));
audio.addEventListener("error",   ()=> $("status").textContent = "Couldn't load this track. Check your connection or skip to the next.");

// ---- Controls ----
$("play").addEventListener("click", toggle);
$("next").addEventListener("click", ()=> load(index+1, true));
$("prev").addEventListener("click", ()=>{
  // Restart the track if more than 3s in, otherwise go back one
  audio.currentTime > 3 ? (audio.currentTime = 0) : load(index-1, true);
});

const seek = $("seek");
seek.addEventListener("input", ()=>{
  seeking = true; fill(seek);
  if (audio.duration) $("cur").textContent = fmt(seek.value/100*audio.duration);
});
seek.addEventListener("change", ()=>{
  if (audio.duration) audio.currentTime = seek.value/100*audio.duration;
  seeking = false;
});

const vol = $("volume");
vol.addEventListener("input", ()=>{ audio.volume = +vol.value; fill(vol); });
fill(vol);

// Keyboard: space = play/pause, arrows = skip (ignored when a slider has focus)
document.addEventListener("keydown", e=>{
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space"){ e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight") $("next").click();
  if (e.code === "ArrowLeft") $("prev").click();
});

// Media keys / lock screen controls
if ("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play", play);
  navigator.mediaSession.setActionHandler("pause", ()=>audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", ()=>$("next").click());
  navigator.mediaSession.setActionHandler("previoustrack", ()=>$("prev").click());
}

renderList();
load(0, false);
</script>
</body>
</html>
